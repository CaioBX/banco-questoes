<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco de Questões Multidisciplinar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: faixa de capa na cor da disciplina (quadriculado em Matemática, pautado em Português),
   barra fixa com busca e anos, filtros na lateral (painel inferior no celular), questões como folhas. */
:root {
  --papel: #F3F5F9;
  --folha: #FFFFFF;
  --tinta: #151D2E;
  --grafite: #5A6478;
  --linha: #DCE2EB;
  --linha-forte: #C3CCD9;
  --azul: #2648C9;
  --azul-suave: #E9EEFD;
  --azul-banda: #2140B3;
  --verde: #0B7A63;
  --verde-suave: #E1F3EE;
  --verde-banda: #0A6653;
  --sobre-banda: #FFFFFF;
  --marca: #FFE45E;
  --marca-tinta: #332A00;
  --certo: #1B7748;
  --certo-suave: #E5F4EB;
  --sombra: 0 1px 2px rgba(21, 29, 46, 0.06), 0 6px 18px rgba(21, 29, 46, 0.06);
  --veu: rgba(10, 14, 22, 0.5);
  --f-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-codigo: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --acento: var(--azul);
  --acento-suave: var(--azul-suave);
  --banda: var(--azul-banda);
  --raio: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #0E121A; --folha: #161C27; --tinta: #E6EAF2; --grafite: #9BA5B8; --linha: #283142; --linha-forte: #3A4559;
    --azul: #8DA4FF; --azul-suave: #1C2546; --azul-banda: #18275E; --verde: #4FC6A7; --verde-suave: #10302A; --verde-banda: #0D3A30;
    --sobre-banda: #F2F5FB; --marca: #E7CD4A; --marca-tinta: #1E1900; --certo: #5ECB93; --certo-suave: #132A1F;
    --sombra: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.25); --veu: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #0E121A; --folha: #161C27; --tinta: #E6EAF2; --grafite: #9BA5B8; --linha: #283142; --linha-forte: #3A4559;
  --azul: #8DA4FF; --azul-suave: #1C2546; --azul-banda: #18275E; --verde: #4FC6A7; --verde-suave: #10302A; --verde-banda: #0D3A30;
  --sobre-banda: #F2F5FB; --marca: #E7CD4A; --marca-tinta: #1E1900; --certo: #5ECB93; --certo-suave: #132A1F;
  --sombra: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.25); --veu: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
body[data-d="portugues"] { --acento: var(--verde); --acento-suave: var(--verde-suave); --banda: var(--verde-banda); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.55 var(--f-texto); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-titulo); text-wrap: balance; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- capa ---------- */
.capa { background-color: var(--banda); color: var(--sobre-banda); background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px; }
body[data-d="portugues"] .capa { background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 100% 26px; }
.capa .wrap { padding-block: 22px 20px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.sobre { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; opacity: .8; }
.capa h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; line-height: 1.02; letter-spacing: -.01em; margin-top: 4px; }
.capa p { margin: 6px 0 0; opacity: .85; font-size: 15px; }
.abas { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.18); }
.abas a { color: var(--sobre-banda); text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: .85; }
.abas a[aria-current="page"] { background: var(--sobre-banda); color: var(--banda); opacity: 1; }

/* ---------- barra fixa ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--folha); }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--folha); border-bottom: 1px solid var(--linha); }
.barra .wrap { padding-block: 10px; display: grid; gap: 10px; }
.linha-busca { display: flex; gap: 8px; }
.busca { position: relative; flex: 1; min-width: 0; }
.busca svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--grafite); pointer-events: none; }
.busca input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid var(--linha-forte); border-radius: 10px; background: var(--papel); min-height: 44px; }
.anos { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px; }
.anos::-webkit-scrollbar { display: none; }
.ano-chip { flex: none; min-width: 44px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--linha-forte); background: var(--folha); font-family: var(--f-titulo); font-weight: 800; font-size: 15px; }
.ano-chip span { font-family: var(--f-texto); font-weight: 400; font-size: 12px; color: var(--grafite); margin-left: 4px; }
.ano-chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--folha); }
.ano-chip[aria-pressed="true"] span { color: inherit; opacity: .8; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 20px 140px; }
.filtros { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 128px); background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); display: flex; flex-direction: column; max-height: calc(100vh - 150px); }
.filtros-cab { display: none; }
.filtros-corpo { padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 20px; }
.filtros-pe { display: none; }
.grupo-tit { display: block; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--grafite); margin: 0 0 8px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
.campo { width: 100%; padding: 10px 12px; border: 1px solid var(--linha-forte); border-radius: 10px; background: var(--papel); min-height: 44px; }
.opcoes { display: flex; flex-direction: column; gap: 2px; }
.opcoes label { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-radius: 8px; font-size: 15px; cursor: pointer; }
.opcoes label:hover { background: var(--papel); }
.opcoes input { accent-color: var(--acento); width: 18px; height: 18px; margin: 0; flex: none; }
.opcoes small { margin-left: auto; color: var(--grafite); font-variant-numeric: tabular-nums; font-size: 13px; }
.link { background: none; border: 0; padding: 0; color: var(--acento); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-align: left; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 1px solid var(--acento); background: var(--acento); color: var(--folha); border-radius: 10px; padding: 0 18px; font-weight: 700; }
.btn-sec { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; border: 1px solid var(--linha-forte); background: var(--folha); color: var(--tinta); border-radius: 10px; padding: 0 14px; font-weight: 700; font-size: 14px; }
.btn-sec:hover { border-color: var(--acento); }
.btn:disabled, .btn-sec:disabled { opacity: .45; cursor: default; }
.btn-filtros { display: none; }
.btn-filtros b { background: var(--acento); color: var(--folha); border-radius: 999px; min-width: 20px; height: 20px; font-size: 12px; display: inline-grid; place-items: center; padding: 0 6px; }

/* ---------- resultados ---------- */
.res-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.res-topo p { margin: 0; color: var(--grafite); }
.res-topo p b { color: var(--tinta); font-variant-numeric: tabular-nums; }
.ativos { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 14px; }
.ativo { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--acento-suave); color: var(--tinta); padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.ativo i { font-style: normal; color: var(--acento); font-size: 15px; line-height: 1; }
#lista { display: flex; flex-direction: column; gap: 14px; }

.q { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); min-width: 0; overflow: hidden; }
.q.sel { border-color: var(--acento); box-shadow: 0 0 0 2px var(--acento), var(--sombra); }
.q-cab { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px 0; }
.selo { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--acento-suave); color: var(--acento); display: grid; place-content: center; text-align: center; line-height: 1; }
.selo b { font-family: var(--f-titulo); font-size: 22px; font-weight: 800; }
.selo small { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
.q-tit { flex: 1; min-width: 0; }
.q-tit h3 { font-size: 18px; line-height: 1.25; }
.q-tit p { margin: 2px 0 0; color: var(--grafite); font-size: 14px; }
.btn-sel { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--acento); background: var(--folha); color: var(--acento); font-weight: 700; font-size: 14px; }
.btn-sel svg { width: 16px; height: 16px; }
.btn-sel[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: var(--marca-tinta); }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 18px 0 84px; font-size: 13px; color: var(--grafite); }
.cod { font-family: var(--f-codigo); font-size: 12px; }
.dif { display: inline-flex; align-items: center; gap: 6px; }
.dif i { display: inline-flex; gap: 2px; }
.dif i b { width: 5px; height: 11px; border-radius: 2px; background: var(--linha-forte); }
.dif i b.on { background: var(--tinta); }
.tag { border: 1px solid var(--linha-forte); padding: 0 8px; border-radius: 999px; }
.tag.voz { border-color: transparent; background: var(--acento-suave); color: var(--acento); font-weight: 700; }
.q-corpo { padding: 14px 18px 0; }
.enun { margin: 0 0 12px; white-space: pre-line; font-size: 17px; line-height: 1.6; }
.alts { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alts li { display: flex; gap: 12px; align-items: baseline; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--linha); }
.alts .l { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--linha-forte); display: inline-grid; place-items: center; font-family: var(--f-titulo); font-weight: 800; font-size: 13px; color: var(--grafite); transform: translateY(2px); }
.alts .t { min-width: 0; overflow-wrap: anywhere; }
.q.aberta .alts li.ok { background: var(--certo-suave); border-color: var(--certo); }
.q.aberta .alts li.ok .l { background: var(--certo); border-color: var(--certo); color: var(--folha); }
.tab-wrap { overflow-x: auto; margin: 0 0 12px; }
table.dados { border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.dados th, table.dados td { border: 1px solid var(--linha-forte); padding: 6px 14px; text-align: left; }
table.dados th { background: var(--papel); }
details.texto { border: 1px solid var(--linha); border-radius: 10px; margin: 0 0 12px; background: var(--papel); }
details.texto summary { cursor: pointer; padding: 10px 14px; font-size: 14px; color: var(--grafite); list-style-position: inside; }
details.texto summary b { color: var(--tinta); }
.texto-corpo { padding: 2px 16px 14px; font-size: 16px; max-width: 68ch; }
.texto-corpo p { margin: 0 0 8px; }
.verso p { margin: 0 !important; }
.verso p.vazio { height: 12px; }
.q-acoes { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px 16px; }
.resp { margin: 0 18px 18px; background: var(--certo-suave); border-radius: 10px; padding: 14px 16px; }
.resp h4 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--certo); margin: 0 0 6px; font-family: var(--f-texto); }
.resp p { margin: 0 0 8px; max-width: 75ch; }
.resp p:last-child { margin-bottom: 0; }
.gab { font-family: var(--f-titulo); font-weight: 800; font-size: 20px; color: var(--certo); }
.vazio-box, .aviso { background: var(--folha); border: 1px dashed var(--linha-forte); border-radius: var(--raio); padding: 32px 20px; text-align: center; color: var(--grafite); }
#mais { margin: 18px auto 0; display: flex; }

/* ---------- seleção ---------- */
.barra-sel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--tinta); color: var(--papel); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.barra-sel .wrap { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.barra-sel p { margin: 0; display: flex; align-items: center; gap: 10px; min-width: 0; }
.barra-sel p b { font-family: var(--f-titulo); font-size: 20px; background: var(--marca); color: var(--marca-tinta); min-width: 34px; height: 34px; border-radius: 8px; display: inline-grid; place-items: center; padding: 0 6px; font-variant-numeric: tabular-nums; }
.barra-sel .acoes { display: flex; gap: 14px; align-items: center; flex: none; }
.barra-sel .link { color: var(--papel); }
.barra-sel .btn { background: var(--papel); color: var(--tinta); border-color: var(--papel); }

.veu { position: fixed; inset: 0; z-index: 20; background: var(--veu); }
.painel { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--folha); display: flex; flex-direction: column; box-shadow: -10px 0 36px rgba(0,0,0,.2); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.painel-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--linha); }
.painel-cab h2 { font-size: 22px; }
.painel-corpo { flex: 1; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 22px; }
.painel-pe { padding: 14px 20px; border-top: 1px solid var(--linha); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.painel-pe .btn { grid-column: 1 / -1; }
.sel-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: n; }
.sel-lista li { display: flex; gap: 8px; align-items: center; border: 1px solid var(--linha); border-radius: 10px; padding: 8px 8px 8px 10px; counter-increment: n; min-width: 0; }
.sel-lista li::before { content: counter(n); font-family: var(--f-titulo); font-weight: 800; color: var(--acento); width: 1.5em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.sel-info { flex: 1; min-width: 0; font-size: 14px; }
.sel-info span { display: block; color: var(--grafite); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { border: 1px solid var(--linha); background: var(--folha); border-radius: 8px; width: 34px; height: 34px; display: inline-grid; place-items: center; flex: none; padding: 0; font-size: 15px; line-height: 1; }
.mini:disabled { opacity: .3; cursor: default; }
.form-grid { display: grid; gap: 14px; }
.op { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.op input { accent-color: var(--acento); width: 18px; height: 18px; margin-top: 3px; flex: none; }
.op small { display: block; color: var(--grafite); font-size: 13px; }
.nota { font-size: 13px; color: var(--grafite); margin: 0; }

/* ---------- projeção ---------- */
.projecao { position: fixed; inset: 0; z-index: 30; background: var(--folha); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.proj-topo, .proj-pe { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proj-topo { border-bottom: 1px solid var(--linha); color: var(--grafite); font-size: 15px; }
.proj-topo .info { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-topo b { color: var(--tinta); font-family: var(--f-titulo); font-size: 20px; font-variant-numeric: tabular-nums; }
.proj-pe { border-top: 1px solid var(--linha); }
.proj-corpo { flex: 1; overflow: auto; display: grid; gap: 32px; align-content: start; grid-template-columns: minmax(0, 1fr); padding-block: 28px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); font-size: clamp(19px, 2.3vw, 32px); line-height: 1.45; max-width: 1500px; width: 100%; margin: 0 auto; }
.proj-corpo.com-texto { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
.proj-texto { font-size: .78em; border-right: 2px solid var(--linha); padding-right: 28px; }
.proj-texto h3 { font-size: 1.15em; margin-bottom: 10px; }
.proj-texto p { margin: 0 0 .5em; }
.proj-texto.verso p.vazio { height: .6em; }
.proj-corpo .enun { font-size: 1em; }
.proj-corpo .alts li { padding: .35em .6em; }
.proj-corpo .alts .l { width: 1.4em; height: 1.4em; font-size: .7em; transform: none; }
.proj-corpo .alts li.ok.on { background: var(--certo-suave); border-color: var(--certo); }
.proj-corpo .alts li.ok.on .l { background: var(--certo); border-color: var(--certo); color: var(--folha); }
.proj-corpo .resp { margin: 16px 0 0; font-size: .7em; }
.proj-corpo table.dados { font-size: .85em; }

#impressao { display: none; }

/* ---------- celular ---------- */
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding-block: 14px 120px; }
  .btn-filtros { display: inline-flex; }
  .filtros { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; top: auto; max-height: 86vh; border-radius: 18px 18px 0 0; border: 0; box-shadow: 0 -10px 36px rgba(0,0,0,.25); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateY(105%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
  .filtros.aberto { transform: none; visibility: visible; transition: transform .25s ease; }
  .filtros-cab { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--linha); }
  .filtros-cab h2 { font-size: 20px; }
  .filtros-pe { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--linha); }
  .filtros-pe .btn { flex: 1; }
  .capa .wrap { padding-block: 16px 14px; }
  .capa p { font-size: 14px; }
  .q-cab { padding: 14px 14px 0; gap: 12px; }
  .selo { width: 44px; height: 44px; border-radius: 10px; }
  .selo b { font-size: 19px; }
  .q-tit h3 { font-size: 16px; }
  .q-meta { padding: 10px 14px 0; }
  .q-corpo { padding: 12px 14px 0; }
  .enun { font-size: 16px; }
  .q-acoes { padding: 12px 14px 14px; }
  .q-acoes .btn-sec { flex: 1 1 0; }
  .resp { margin: 0 14px 14px; }
  .btn-sel .rot, .so-largo { display: none; }
  .capa h1 { font-size: 30px; }
  .abas a { padding: 6px 12px; font-size: 13px; }
  .btn-sel { width: 40px; padding: 0; justify-content: center; }
  .barra-sel .link { display: none; }
  .proj-corpo.com-texto { grid-template-columns: minmax(0, 1fr); }
  .proj-texto { border-right: 0; padding-right: 0; border-bottom: 2px solid var(--linha); padding-bottom: 18px; }
  .painel { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .filtros { transition: none !important; } }
@media (prefers-reduced-motion: no-preference) { .q, .btn-sec, .ano-chip, .btn-sel { transition: border-color .15s, background-color .15s, box-shadow .15s, color .15s; } }

@media print {
  @page { size: A4; margin: 14mm 15mm; }
  body { background: #fff !important; color: #000; }
  body > *:not(#impressao) { display: none !important; }
  body::before { display: none; }
  #impressao { display: block; }
}
</style>
</head>
<body>
<header class="capa">
  <div class="wrap">
    <div>
      <span class="sobre">Banco de Questões</span>
      <h1 id="titulo">Carregando…</h1>
      <p id="resumo">Questões prontas com resposta comentada</p>
    </div>
    <nav id="abas" class="abas" aria-label="Componente curricular" hidden></nav>
  </div>
</header>

<div class="barra">
  <div class="wrap">
    <div class="linha-busca">
      <div class="busca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="f-busca" type="search" placeholder="Buscar questões" autocomplete="off" aria-label="Buscar questões">
      </div>
      <button id="btn-filtros" class="btn-sec btn-filtros" type="button" aria-controls="filtros" aria-expanded="false">Filtros</button>
    </div>
    <div id="f-anos" class="anos" role="group" aria-label="Ano"></div>
  </div>
</div>

<main class="wrap layout">
  <aside id="filtros" class="filtros" aria-label="Filtros">
    <div class="filtros-cab">
      <h2>Filtros</h2>
      <button id="fechar-filtros" class="btn-sec" type="button">Fechar</button>
    </div>
    <div class="filtros-corpo">
      <fieldset><legend class="grupo-tit" id="lg-eixo">Eixo</legend><div id="f-eixos" class="opcoes"></div></fieldset>
      <div>
        <label class="grupo-tit" for="f-assunto">Assunto</label>
        <select id="f-assunto" class="campo"></select>
      </div>
      <fieldset><legend class="grupo-tit">Dificuldade</legend><div id="f-dif" class="opcoes"></div></fieldset>
      <fieldset><legend class="grupo-tit">Tipo de questão</legend><div id="f-tipo" class="opcoes"></div></fieldset>
      <button id="limpar" class="link" type="button">Limpar todos os filtros</button>
    </div>
    <div class="filtros-pe">
      <button id="ver-res" class="btn" type="button">Ver questões</button>
    </div>
  </aside>

  <section aria-live="polite">
    <div class="res-topo">
      <p id="contagem"></p>
      <button id="sel-todas" class="btn-sec" type="button">Selecionar todas</button>
    </div>
    <div id="ativos" class="ativos"></div>
    <div id="lista"></div>
    <button id="mais" class="btn-sec" type="button" hidden>Mostrar mais questões</button>
  </section>
</main>

<div id="veu-filtros" class="veu" hidden></div>

<div id="barra-sel" class="barra-sel" hidden>
  <div class="wrap">
    <p><b id="n-sel">0</b><span id="t-sel">selecionadas</span></p>
    <div class="acoes">
      <button id="limpar-sel" class="link" type="button">Limpar</button>
      <button id="abrir-painel" class="btn" type="button">Montar material</button>
    </div>
  </div>
</div>

<div id="painel-wrap" hidden>
  <div id="veu-painel" class="veu"></div>
  <div class="painel" role="dialog" aria-modal="true" aria-labelledby="painel-tit">
    <div class="painel-cab">
      <h2 id="painel-tit">Montar material</h2>
      <button id="fechar-painel" class="btn-sec" type="button">Fechar</button>
    </div>
    <div class="painel-corpo">
      <ol id="sel-lista" class="sel-lista"></ol>
      <div class="form-grid">
        <div>
          <label class="grupo-tit" for="o-modelo">Tipo de material</label>
          <select id="o-modelo" class="campo">
            <option>Lista de exercícios</option>
            <option>Avaliação</option>
            <option>Atividade de fixação</option>
            <option>Atividade em sala</option>
          </select>
        </div>
        <div>
          <label class="grupo-tit" for="o-titulo">Título</label>
          <input id="o-titulo" class="campo" type="text">
        </div>
        <div>
          <label class="grupo-tit" for="o-escola">Escola (opcional)</label>
          <input id="o-escola" class="campo" type="text" placeholder="Nome da escola">
        </div>
        <label class="op"><input id="o-cab" type="checkbox" checked><span>Campos de identificação<small>Aluno(a), turma e data no topo da folha.</small></span></label>
        <label class="op"><input id="o-gab" type="checkbox" checked><span>Gabarito no final<small>Em página separada, para o professor.</small></span></label>
        <label class="op"><input id="o-com" type="checkbox"><span>Respostas comentadas no gabarito<small>Versão do professor, com a explicação de cada questão.</small></span></label>
        <label class="op"><input id="o-emb" type="checkbox"><span>Embaralhar alternativas<small>Cada impressão sai em uma ordem diferente; o gabarito acompanha.</small></span></label>
      </div>
      <p class="nota">Para gerar PDF, escolha “Salvar como PDF” na janela de impressão.</p>
    </div>
    <div class="painel-pe">
      <button id="b-imprimir" class="btn" type="button">Imprimir ou salvar PDF</button>
      <button id="b-word" class="btn-sec" type="button">Baixar para Word</button>
      <button id="b-projetar" class="btn-sec" type="button">Projetar em sala</button>
    </div>
  </div>
</div>

<div id="projecao" class="projecao" hidden role="dialog" aria-modal="true" aria-label="Modo de projeção">
  <div class="proj-topo">
    <span class="info">Questão <b id="p-pos">1</b> de <span id="p-tot">1</span> · <span id="p-meta"></span></span>
    <button id="p-sair" class="btn-sec" type="button">Sair</button>
  </div>
  <div id="p-corpo" class="proj-corpo"></div>
  <div class="proj-pe">
    <button id="p-ant" class="btn-sec" type="button">← Anterior</button>
    <button id="p-resp" class="btn" type="button">Mostrar resposta</button>
    <button id="p-prox" class="btn-sec" type="button">Próxima →</button>
  </div>
</div>

<div id="impressao"></div>

<script>
(() => {
  "use strict";
  const LETRAS = "ABCDE";
  const DIFS = ["fácil", "média", "difícil"];
  const TIPOS = ["objetiva", "discursiva"];
  const POR_PAGINA = 20;
  const $ = (s) => document.querySelector(s);
  const ICO_MAIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  const ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

  const st = {
    lista: [], slug: "", dados: null, textos: {}, porId: new Map(),
    f: novoFiltro(), sel: [], abertas: new Set(), limite: POR_PAGINA,
    proj: { itens: [], i: 0, on: false }
  };
  function novoFiltro() { return { anos: new Set(), eixos: new Set(), assunto: "", difs: new Set(), tipos: new Set(), busca: "" }; }

  // ---------- utilidades ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } };
  const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } };
  const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);
  async function json(url) {
    const r = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(url + " respondeu " + r.status);
    return r.json();
  }
  const ehVerso = (t) => /poema|poesia|cordel|canção|parlenda|quadrinha/i.test(t.genero || "");
  function paragrafos(txt, verso) {
    return String(txt).split("\n").map((l) => (l.trim() === "" ? (verso ? '<p class="vazio"></p>' : "") : "<p>" + esc(l) + "</p>")).join("");
  }
  function comentario(q, mapa) {
    return esc(q.comentario).replace(/\{([A-E])\}/g, (_, l) => "<b>" + (mapa ? mapa(l) : l) + "</b>");
  }
  function tabelaHTML(t) {
    if (!t) return "";
    return '<div class="tab-wrap"><table class="dados"><thead><tr>' + t.cabecalho.map((c) => "<th>" + esc(c) + "</th>").join("") +
      "</tr></thead><tbody>" + t.linhas.map((l) => "<tr>" + l.map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
  }
  function difHTML(d) {
    const n = DIFS.indexOf(d) + 1;
    return '<span class="dif"><i aria-hidden="true">' + [1, 2, 3].map((k) => '<b class="' + (k <= n ? "on" : "") + '"></b>').join("") + "</i>" + esc(d) + "</span>";
  }
  const nomeTipo = (t) => (t === "objetiva" ? "Objetiva" : "Discursiva");
  const nomeDif = (d) => d.charAt(0).toUpperCase() + d.slice(1);

  // ---------- carregamento ----------
  async function iniciar() {
    const fixa = new URLSearchParams(location.search).get("d");
    try { st.lista = (await json("dados/disciplinas.json")).disciplinas; }
    catch (e) { return erro("Não foi possível carregar a lista de disciplinas (dados/disciplinas.json)."); }
    const hash = location.hash.slice(1);
    const existe = (s) => st.lista.some((d) => d.slug === s);
    const slug = existe(fixa) ? fixa : existe(hash) ? hash : st.lista[0].slug;
    if (!fixa && st.lista.length > 1) {
      const nav = $("#abas");
      nav.innerHTML = st.lista.map((d) => '<a href="#' + d.slug + '" data-slug="' + d.slug + '">' + esc(d.nome) + "</a>").join("");
      nav.hidden = false;
      window.addEventListener("hashchange", () => { const s = location.hash.slice(1); if (existe(s) && s !== st.slug) carregar(s); });
    }
    carregar(slug);
  }

  async function carregar(slug) {
    const d = st.lista.find((x) => x.slug === slug);
    st.slug = slug;
    document.body.dataset.d = slug;
    document.querySelectorAll("#abas a").forEach((a) => (a.dataset.slug === slug ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    $("#titulo").textContent = d.nome;
    try { st.dados = await json("dados/" + d.arquivo); }
    catch (e) { return erro("Não foi possível carregar as questões de " + d.nome + " (dados/" + d.arquivo + "). Confira se o arquivo existe e se o JSON é válido."); }
    st.textos = st.dados.textos || {};
    st.dados.questoes.sort((a, b) => a.ano - b.ano || a.id.localeCompare(b.id));
    st.porId = new Map(st.dados.questoes.map((q) => [q.id, q]));
    const salvo = ler("bq:" + slug, {});
    st.sel = (salvo.sel || []).filter((id) => st.porId.has(id));
    st.f = { anos: new Set(salvo.anos || []), eixos: new Set(salvo.eixos || []), assunto: salvo.assunto || "", difs: new Set(salvo.difs || []), tipos: new Set(salvo.tipos || []), busca: salvo.busca || "" };
    st.abertas = new Set();
    st.limite = POR_PAGINA;
    const anos = [...new Set(qs().map((q) => q.ano))].sort((a, b) => a - b);
    $("#resumo").innerHTML = st.dados.questoes.length + " questões · " + anos[0] + "º ao " + anos[anos.length - 1] + "º ano<span class=\"so-largo\"> · todas com resposta comentada</span>";
    $("#lg-eixo").textContent = st.dados.rotulo_eixo || "Eixo";
    $("#f-busca").value = st.f.busca;
    $("#o-titulo").value = "";
    montarFiltros();
    render();
  }

  function erro(msg) {
    $("#lista").innerHTML = '<div class="aviso"><h3>Não foi possível abrir o banco</h3><p>' + esc(msg) + "</p></div>";
    $("#contagem").textContent = "";
  }
  function salvar() {
    gravar("bq:" + st.slug, { sel: st.sel, anos: [...st.f.anos], eixos: [...st.f.eixos], assunto: st.f.assunto, difs: [...st.f.difs], tipos: [...st.f.tipos], busca: st.f.busca });
  }

  // ---------- filtros ----------
  const qs = () => st.dados.questoes;
  function contar(campo) { const c = new Map(); qs().forEach((q) => c.set(q[campo], (c.get(q[campo]) || 0) + 1)); return c; }
  function opcoes(el, nome, valores, ativo, rotulo, cont) {
    el.innerHTML = valores.filter((v) => cont.get(v)).map((v, i) => '<label><input type="checkbox" id="' + nome + "-" + i + '" value="' + esc(v) + '"' + (ativo.has(v) ? " checked" : "") + "><span>" + esc(rotulo(v)) + "</span><small>" + cont.get(v) + "</small></label>").join("");
  }
  function montarAnos() {
    const c = contar("ano");
    const anos = [...c.keys()].sort((a, b) => a - b);
    $("#f-anos").innerHTML = '<button type="button" class="ano-chip" data-v="todos" aria-pressed="' + (st.f.anos.size === 0) + '">Todos</button>' +
      anos.map((a) => '<button type="button" class="ano-chip" data-v="' + a + '" aria-pressed="' + st.f.anos.has(a) + '" aria-label="' + a + 'º ano, ' + c.get(a) + ' questões">' + a + "º<span>" + c.get(a) + "</span></button>").join("");
  }
  function montarFiltros() {
    montarAnos();
    opcoes($("#f-eixos"), "eixo", st.dados.eixos || [...new Set(qs().map((q) => q.eixo))], st.f.eixos, (v) => v, contar("eixo"));
    opcoes($("#f-dif"), "dif", DIFS, st.f.difs, nomeDif, contar("dificuldade"));
    opcoes($("#f-tipo"), "tipo", TIPOS, st.f.tipos, nomeTipo, contar("tipo"));
    montarAssuntos();
  }
  function montarAssuntos() {
    const base = qs().filter((q) => (!st.f.eixos.size || st.f.eixos.has(q.eixo)) && (!st.f.anos.size || st.f.anos.has(q.ano)));
    const c = new Map();
    base.forEach((q) => c.set(q.assunto, (c.get(q.assunto) || 0) + 1));
    if (st.f.assunto && !c.has(st.f.assunto)) st.f.assunto = "";
    const nomes = [...c.keys()].sort((a, b) => a.localeCompare(b, "pt-BR"));
    $("#f-assunto").innerHTML = '<option value="">Todos os assuntos</option>' + nomes.map((n) => '<option value="' + esc(n) + '"' + (n === st.f.assunto ? " selected" : "") + ">" + esc(n) + " (" + c.get(n) + ")</option>").join("");
  }
  function filtradas() {
    const termos = norm(st.f.busca).split(/\s+/).filter(Boolean);
    return qs().filter((q) => {
      if (st.f.anos.size && !st.f.anos.has(q.ano)) return false;
      if (st.f.eixos.size && !st.f.eixos.has(q.eixo)) return false;
      if (st.f.assunto && q.assunto !== st.f.assunto) return false;
      if (st.f.difs.size && !st.f.difs.has(q.dificuldade)) return false;
      if (st.f.tipos.size && !st.f.tipos.has(q.tipo)) return false;
      if (termos.length) {
        const t = st.textos[q.texto];
        const alvo = norm([q.id, q.assunto, q.eixo, q.enunciado, (q.alternativas || []).join(" "), t ? t.titulo + " " + t.genero : ""].join(" "));
        if (!termos.every((x) => alvo.includes(x))) return false;
      }
      return true;
    });
  }
  function nAtivos() { return st.f.eixos.size + (st.f.assunto ? 1 : 0) + st.f.difs.size + st.f.tipos.size; }
  function renderAtivos() {
    const it = [];
    [...st.f.anos].sort((a, b) => a - b).forEach((a) => it.push(["ano", a, a + "º ano"]));
    st.f.eixos.forEach((e) => it.push(["eixo", e, e]));
    if (st.f.assunto) it.push(["assunto", st.f.assunto, st.f.assunto]);
    st.f.difs.forEach((d) => it.push(["dif", d, nomeDif(d)]));
    st.f.tipos.forEach((t) => it.push(["tipo", t, nomeTipo(t)]));
    if (st.f.busca) it.push(["busca", "", "“" + st.f.busca + "”"]);
    $("#ativos").innerHTML = it.map(([k, v, r]) => '<button type="button" class="ativo" data-k="' + k + '" data-v="' + esc(v) + '" aria-label="Remover filtro ' + esc(r) + '">' + esc(r) + "<i>×</i></button>").join("");
    $("#ativos").hidden = !it.length;
  }

  // ---------- lista ----------
  function cartao(q) {
    const sel = st.sel.includes(q.id), aberta = st.abertas.has(q.id), t = st.textos[q.texto];
    const texto = t ? '<details class="texto"><summary>Texto-base: <b>' + esc(t.titulo) + "</b> · " + esc(t.genero) + '</summary><div class="texto-corpo' + (ehVerso(t) ? " verso" : "") + '">' + paragrafos(t.conteudo, ehVerso(t)) + "</div></details>" : "";
    const alts = q.tipo === "objetiva" ? '<ol class="alts">' + q.alternativas.map((a, i) => '<li class="' + (LETRAS[i] === q.gabarito ? "ok" : "") + '"><span class="l">' + LETRAS[i] + '</span><span class="t">' + esc(a) + "</span></li>").join("") + "</ol>" : "";
    const resp = q.tipo === "objetiva"
      ? "<h4>Gabarito</h4><p><span class=\"gab\">" + q.gabarito + "</span></p><h4>Comentário</h4><p>" + comentario(q) + "</p>"
      : "<h4>Resposta esperada</h4><p>" + esc(q.resposta_esperada) + "</p><h4>Orientações de correção</h4><p>" + comentario(q) + "</p>";
    return '<article class="q' + (sel ? " sel" : "") + (aberta ? " aberta" : "") + '" data-id="' + esc(q.id) + '">' +
      '<div class="q-cab"><div class="selo" aria-label="' + q.ano + 'º ano"><b>' + q.ano + "º</b><small>ano</small></div>" +
      '<div class="q-tit"><h3>' + esc(q.assunto) + "</h3><p>" + esc(q.eixo) + "</p></div>" +
      '<button type="button" class="btn-sel" data-acao="sel" aria-pressed="' + sel + '" aria-label="' + (sel ? "Remover da seleção" : "Adicionar à seleção") + '">' + (sel ? ICO_OK : ICO_MAIS) + '<span class="rot">' + (sel ? "Selecionada" : "Selecionar") + "</span></button></div>" +
      '<div class="q-meta">' + difHTML(q.dificuldade) + '<span class="tag">' + nomeTipo(q.tipo) + "</span>" + (q.ano <= 2 ? '<span class="tag voz">Leitura pelo professor</span>' : "") + '<span class="cod">' + esc(q.id) + "</span></div>" +
      '<div class="q-corpo">' + texto + '<p class="enun">' + esc(q.enunciado) + "</p>" + tabelaHTML(q.tabela) + alts + "</div>" +
      '<div class="q-acoes"><button type="button" class="btn-sec" data-acao="resp" aria-expanded="' + aberta + '">' + (aberta ? "Ocultar resposta" : "Ver resposta comentada") + "</button>" +
      '<button type="button" class="btn-sec" data-acao="proj">Projetar</button></div>' +
      (aberta ? '<div class="resp">' + resp + "</div>" : "") + "</article>";
  }
  function render() {
    const lista = filtradas(), n = lista.length, tot = qs().length;
    $("#contagem").innerHTML = n === tot ? "<b>" + tot + "</b> questões no acervo" : "<b>" + n + "</b> de " + tot + " questões";
    $("#sel-todas").hidden = n === 0;
    $("#lista").innerHTML = n ? lista.slice(0, st.limite).map(cartao).join("")
      : '<div class="vazio-box"><p>Nenhuma questão encontrada com esses filtros.</p><button type="button" class="link" data-acao="limpar">Limpar filtros</button></div>';
    $("#mais").hidden = n <= st.limite;
    $("#mais").textContent = "Mostrar mais questões (" + (n - st.limite) + " restantes)";
    const a = nAtivos();
    $("#btn-filtros").innerHTML = "Filtros" + (a ? " <b>" + a + "</b>" : "");
    $("#ver-res").textContent = n ? "Ver " + plural(n, "questão", "questões") : "Nenhuma questão";
    renderAtivos();
    barra();
    salvar();
  }
  function barra() {
    $("#barra-sel").hidden = st.sel.length === 0;
    $("#n-sel").textContent = st.sel.length;
    $("#t-sel").textContent = st.sel.length === 1 ? "selecionada" : "selecionadas";
  }
  function atualizarCartao(id) {
    const el = document.querySelector('.q[data-id="' + CSS.escape(id) + '"]');
    if (el) el.outerHTML = cartao(st.porId.get(id));
  }

  // ---------- eventos dos filtros ----------
  const alternar = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));
  function refiltrar() { st.limite = POR_PAGINA; render(); }
  $("#f-anos").addEventListener("click", (e) => {
    const b = e.target.closest(".ano-chip"); if (!b) return;
    if (b.dataset.v === "todos") st.f.anos.clear(); else alternar(st.f.anos, Number(b.dataset.v));
    montarAnos(); montarAssuntos(); refiltrar();
  });
  $("#f-eixos").addEventListener("change", (e) => { alternar(st.f.eixos, e.target.value); montarAssuntos(); refiltrar(); });
  $("#f-dif").addEventListener("change", (e) => { alternar(st.f.difs, e.target.value); refiltrar(); });
  $("#f-tipo").addEventListener("change", (e) => { alternar(st.f.tipos, e.target.value); refiltrar(); });
  $("#f-assunto").addEventListener("change", (e) => { st.f.assunto = e.target.value; refiltrar(); });
  let tBusca;
  $("#f-busca").addEventListener("input", (e) => { clearTimeout(tBusca); tBusca = setTimeout(() => { st.f.busca = e.target.value.trim(); refiltrar(); }, 180); });
  function limparFiltros() { st.f = novoFiltro(); $("#f-busca").value = ""; montarFiltros(); refiltrar(); }
  $("#limpar").addEventListener("click", limparFiltros);
  $("#ativos").addEventListener("click", (e) => {
    const b = e.target.closest(".ativo"); if (!b) return;
    const { k, v } = b.dataset;
    if (k === "ano") st.f.anos.delete(Number(v));
    else if (k === "eixo") st.f.eixos.delete(v);
    else if (k === "assunto") st.f.assunto = "";
    else if (k === "dif") st.f.difs.delete(v);
    else if (k === "tipo") st.f.tipos.delete(v);
    else if (k === "busca") { st.f.busca = ""; $("#f-busca").value = ""; }
    montarFiltros(); refiltrar();
  });
  function abrirFiltros() { $("#filtros").classList.add("aberto"); $("#veu-filtros").hidden = false; $("#btn-filtros").setAttribute("aria-expanded", "true"); }
  function fecharFiltros() { $("#filtros").classList.remove("aberto"); $("#veu-filtros").hidden = true; $("#btn-filtros").setAttribute("aria-expanded", "false"); }
  $("#btn-filtros").addEventListener("click", abrirFiltros);
  $("#fechar-filtros").addEventListener("click", fecharFiltros);
  $("#veu-filtros").addEventListener("click", fecharFiltros);
  $("#ver-res").addEventListener("click", () => { fecharFiltros(); $("#lista").scrollIntoView({ block: "start" }); });
  $("#mais").addEventListener("click", () => { st.limite += POR_PAGINA; render(); });
  $("#sel-todas").addEventListener("click", () => { filtradas().forEach((q) => { if (!st.sel.includes(q.id)) st.sel.push(q.id); }); render(); });

  // ---------- ações nos cartões ----------
  $("#lista").addEventListener("click", (e) => {
    const b = e.target.closest("[data-acao]"); if (!b) return;
    if (b.dataset.acao === "limpar") return limparFiltros();
    const id = b.closest(".q").dataset.id;
    if (b.dataset.acao === "sel") {
      const i = st.sel.indexOf(id);
      i >= 0 ? st.sel.splice(i, 1) : st.sel.push(id);
      atualizarCartao(id); barra(); salvar();
      const nb = document.querySelector('.q[data-id="' + CSS.escape(id) + '"] [data-acao="sel"]'); if (nb) nb.focus();
    } else if (b.dataset.acao === "resp") {
      alternar(st.abertas, id); atualizarCartao(id);
      const nb = document.querySelector('.q[data-id="' + CSS.escape(id) + '"] [data-acao="resp"]'); if (nb) nb.focus();
    } else if (b.dataset.acao === "proj") {
      projetar([st.porId.get(id)]);
    }
  });

  // ---------- painel de montagem ----------
  const prefs = ler("bq:prefs", {});
  $("#o-escola").value = prefs.escola || "";
  ["o-cab", "o-gab", "o-com", "o-emb"].forEach((k) => { if (k in prefs) $("#" + k).checked = prefs[k]; });
  $("#o-modelo").value = prefs.modelo || "Lista de exercícios";
  function lerOpcoes() {
    const o = { escola: $("#o-escola").value.trim(), modelo: $("#o-modelo").value, "o-cab": $("#o-cab").checked, "o-gab": $("#o-gab").checked, "o-com": $("#o-com").checked, "o-emb": $("#o-emb").checked };
    gravar("bq:prefs", o);
    return o;
  }
  ["o-escola", "o-modelo", "o-cab", "o-gab", "o-com", "o-emb"].forEach((k) => $("#" + k).addEventListener("change", lerOpcoes));
  const tituloPadrao = () => $("#o-modelo").value + " de " + st.dados.disciplina;
  $("#o-modelo").addEventListener("change", () => { $("#o-titulo").placeholder = tituloPadrao(); });

  function renderSel() {
    const n = st.sel.length;
    $("#sel-lista").innerHTML = n ? st.sel.map((id, i) => {
      const q = st.porId.get(id);
      return '<li data-id="' + esc(id) + '"><div class="sel-info"><b>' + q.ano + "º ano · " + esc(q.assunto) + "</b><span>" + esc(q.enunciado) + "</span></div>" +
        '<button type="button" class="mini" data-m="-1" aria-label="Subir"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
        '<button type="button" class="mini" data-m="1" aria-label="Descer"' + (i === n - 1 ? " disabled" : "") + ">↓</button>" +
        '<button type="button" class="mini" data-m="x" aria-label="Remover">×</button></li>';
    }).join("") : '<li style="justify-content:center;color:var(--grafite)">Nenhuma questão selecionada.</li>';
    ["#b-imprimir", "#b-word", "#b-projetar"].forEach((s) => ($(s).disabled = !n));
  }
  $("#sel-lista").addEventListener("click", (e) => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    const id = b.closest("li").dataset.id, i = st.sel.indexOf(id);
    if (b.dataset.m === "x") { st.sel.splice(i, 1); atualizarCartao(id); }
    else { const j = i + Number(b.dataset.m); [st.sel[i], st.sel[j]] = [st.sel[j], st.sel[i]]; }
    renderSel(); barra(); salvar();
    if (!st.sel.length) fecharPainel();
  });
  function abrirPainel() { $("#o-titulo").placeholder = tituloPadrao(); renderSel(); $("#painel-wrap").hidden = false; $("#fechar-painel").focus(); }
  function fecharPainel() { $("#painel-wrap").hidden = true; }
  $("#abrir-painel").addEventListener("click", abrirPainel);
  $("#fechar-painel").addEventListener("click", fecharPainel);
  $("#veu-painel").addEventListener("click", fecharPainel);
  $("#limpar-sel").addEventListener("click", () => { st.sel = []; render(); });

  // ---------- documento (impressão e Word) ----------
  function embaralhar(n) {
    const a = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const CSS_DOC = `
    .doc{font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:11.5pt;line-height:1.45;color:#000}
    .doc h1{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:17pt;margin:0 0 2pt}
    .doc .esc{font-size:10pt;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4pt}
    .doc .sub{font-size:10pt;color:#333;margin:0 0 10pt}
    .doc .ident{width:100%;border-collapse:collapse;margin:0 0 14pt;font-size:10.5pt}
    .doc .ident td{border:1px solid #000;padding:6pt 8pt}
    .doc .qd{margin:0 0 14pt;page-break-inside:avoid;break-inside:avoid}
    .doc .num{font-weight:bold}
    .doc .tx{border:1px solid #888;padding:8pt 10pt;margin:0 0 10pt;page-break-inside:avoid;break-inside:avoid}
    .doc .tx h3{font-size:12pt;margin:0 0 4pt}
    .doc .tx .gen{font-size:9pt;color:#444;margin:0 0 6pt}
    .doc .tx p{margin:0 0 4pt}
    .doc .tx.verso p{margin:0}
    .doc .tx.verso p.vazio{height:8pt}
    .doc .ins{font-size:10pt;font-style:italic;margin:0 0 4pt}
    .doc p{margin:0 0 4pt}
    .doc .alt{margin:0 0 2pt 14pt}
    .doc table.dados{border-collapse:collapse;margin:4pt 0 6pt}
    .doc table.dados th,.doc table.dados td{border:1px solid #000;padding:3pt 10pt;text-align:left}
    .doc .linha{border-bottom:1px solid #777;height:22pt}
    .doc .gab{page-break-before:always;break-before:page}
    .doc .gab h2{font-size:15pt;margin:0 0 8pt}
    .doc .gab table{border-collapse:collapse}
    .doc .gab td,.doc .gab th{border:1px solid #000;padding:3pt 10pt;text-align:center}
    .doc .com{margin:8pt 0 0;page-break-inside:avoid;break-inside:avoid}`;

  function documento() {
    const o = lerOpcoes();
    const titulo = $("#o-titulo").value.trim() || tituloPadrao();
    const itens = st.sel.map((id) => st.porId.get(id));
    const anos = [...new Set(itens.map((q) => q.ano))].sort((a, b) => a - b);
    let h = '<div class="doc">';
    if (o.escola) h += '<p class="esc">' + esc(o.escola) + "</p>";
    h += "<h1>" + esc(titulo) + '</h1><p class="sub">' + esc(st.dados.disciplina) + " · " + anos.map((a) => a + "º").join(", ") + " ano · " + plural(itens.length, "questão", "questões") + "</p>";
    if (o["o-cab"]) h += '<table class="ident"><tr><td colspan="2">Aluno(a):</td></tr><tr><td>Turma:</td><td>Data: ____/____/________</td></tr></table>';
    let ultimoTexto = null;
    const gab = [];
    itens.forEach((q, k) => {
      const n = k + 1;
      if (q.texto && q.texto !== ultimoTexto && st.textos[q.texto]) {
        const t = st.textos[q.texto];
        let usa = 0;
        while (k + usa < itens.length && itens[k + usa].texto === q.texto) usa++;
        h += '<div class="tx' + (ehVerso(t) ? " verso" : "") + '"><p class="ins">Leia o texto para responder ' + (usa > 1 ? "às questões " + n + " a " + (n + usa - 1) : "à questão " + n) + ".</p><h3>" + esc(t.titulo) + '</h3><p class="gen">' + esc(t.genero) + " · Texto elaborado para este banco de questões.</p>" + paragrafos(t.conteudo, ehVerso(t)) + "</div>";
      }
      ultimoTexto = q.texto || null;
      h += '<div class="qd"><p><span class="num">' + n + ".</span> " + esc(q.enunciado).replace(/\n/g, "<br>") + "</p>" + tabelaHTML(q.tabela).replace(/<\/?div[^>]*>/g, "");
      if (q.tipo === "objetiva") {
        const perm = o["o-emb"] ? embaralhar(q.alternativas.length) : [...q.alternativas.keys()];
        perm.forEach((orig, pos) => { h += '<p class="alt">(' + LETRAS[pos] + ") " + esc(q.alternativas[orig]) + "</p>"; });
        const novaLetra = (l) => LETRAS[perm.indexOf(LETRAS.indexOf(l))];
        gab.push({ n, q, letra: novaLetra(q.gabarito), com: comentario(q, novaLetra) });
      } else {
        h += '<div class="linha"></div>'.repeat(q.ano <= 5 ? 5 : 6);
        gab.push({ n, q, letra: "—", com: comentario(q) });
      }
      h += "</div>";
    });
    if (o["o-gab"]) {
      h += '<div class="gab"><h2>Gabarito · ' + esc(titulo) + "</h2><table><tr><th>Questão</th>" + gab.map((g) => "<th>" + g.n + "</th>").join("") + "</tr><tr><th>Resposta</th>" + gab.map((g) => "<td>" + g.letra + "</td>").join("") + "</tr></table>";
      if (o["o-com"]) {
        gab.forEach((g) => {
          h += '<div class="com"><p><b>Questão ' + g.n + "</b> · " + esc(g.q.assunto) + (g.q.tipo === "objetiva" ? " · Gabarito: <b>" + g.letra + "</b>" : "") + "</p>" +
            (g.q.tipo === "discursiva" ? "<p><b>Resposta esperada:</b> " + esc(g.q.resposta_esperada) + "</p>" : "") + "<p>" + g.com + "</p></div>";
        });
      } else {
        const disc = gab.filter((g) => g.q.tipo === "discursiva");
        if (disc.length) h += '<p style="margin-top:8pt;font-size:10pt">Questões discursivas: ' + disc.map((g) => g.n + ". " + esc(g.q.resposta_esperada)).join(" ") + "</p>";
      }
      h += "</div>";
    }
    return { html: h + "</div>", titulo };
  }

  $("#b-imprimir").addEventListener("click", () => {
    const d = documento();
    $("#impressao").innerHTML = "<style>" + CSS_DOC + "</style>" + d.html;
    const antes = document.title;
    document.title = d.titulo;
    setTimeout(() => { window.print(); document.title = antes; }, 60);
  });
  $("#b-word").addEventListener("click", () => {
    const d = documento();
    const arquivo = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(d.titulo) +
      "</title><style>@page{size:21cm 29.7cm;margin:1.5cm}" + CSS_DOC + "</style></head><body>" + d.html + "</body></html>";
    const url = URL.createObjectURL(new Blob(["﻿", arquivo], { type: "application/msword" }));
    const a = document.createElement("a");
    a.href = url; a.download = norm(d.titulo).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".doc";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
  $("#b-projetar").addEventListener("click", () => { fecharPainel(); projetar(st.sel.map((id) => st.porId.get(id))); });

  // ---------- projeção ----------
  function projetar(itens) {
    st.proj = { itens, i: 0, on: false };
    $("#projecao").hidden = false;
    try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* opcional */ }
    renderProj();
    $("#p-resp").focus();
  }
  function renderProj() {
    const { itens, i, on } = st.proj, q = itens[i], t = st.textos[q.texto];
    $("#p-pos").textContent = i + 1; $("#p-tot").textContent = itens.length;
    $("#p-meta").textContent = q.ano + "º ano · " + q.assunto;
    const corpo = $("#p-corpo");
    corpo.classList.toggle("com-texto", !!t);
    let h = t ? '<div class="proj-texto' + (ehVerso(t) ? " verso" : "") + '"><h3>' + esc(t.titulo) + "</h3>" + paragrafos(t.conteudo, ehVerso(t)) + "</div>" : "";
    h += '<div><p class="enun">' + esc(q.enunciado) + "</p>" + tabelaHTML(q.tabela);
    if (q.tipo === "objetiva") h += '<ol class="alts">' + q.alternativas.map((a, k) => '<li class="' + (LETRAS[k] === q.gabarito ? "ok" : "") + (on ? " on" : "") + '"><span class="l">' + LETRAS[k] + '</span><span class="t">' + esc(a) + "</span></li>").join("") + "</ol>";
    if (on) h += '<div class="resp">' + (q.tipo === "objetiva" ? "<h4>Gabarito " + q.gabarito + "</h4>" : "<h4>Resposta esperada</h4><p>" + esc(q.resposta_esperada) + "</p>") + "<p>" + comentario(q) + "</p></div>";
    corpo.innerHTML = h + "</div>";
    corpo.scrollTop = 0;
    $("#p-resp").textContent = on ? "Ocultar resposta" : "Mostrar resposta";
    $("#p-ant").disabled = i === 0; $("#p-prox").disabled = i === itens.length - 1;
  }
  function sairProj() {
    $("#projecao").hidden = true;
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) { /* opcional */ }
  }
  $("#p-ant").addEventListener("click", () => { if (st.proj.i > 0) { st.proj.i--; st.proj.on = false; renderProj(); } });
  $("#p-prox").addEventListener("click", () => { if (st.proj.i < st.proj.itens.length - 1) { st.proj.i++; st.proj.on = false; renderProj(); } });
  $("#p-resp").addEventListener("click", () => { st.proj.on = !st.proj.on; renderProj(); });
  $("#p-sair").addEventListener("click", sairProj);
  document.addEventListener("keydown", (e) => {
    if (!$("#projecao").hidden) {
      if (e.key === "ArrowRight") $("#p-prox").click();
      else if (e.key === "ArrowLeft") $("#p-ant").click();
      else if (e.key === "Escape") sairProj();
      else return;
      e.preventDefault();
    } else if (e.key === "Escape") { if (!$("#painel-wrap").hidden) fecharPainel(); else fecharFiltros(); }
  });

  iniciar();
})();
</script>
</body>
</html>
