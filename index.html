<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banco de Questões Multidisciplinar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: caderno do professor — filtros à esquerda, folha de questões à direita, bandeja de seleção que vira material impresso ou projeção.
   Matemática usa papel quadriculado; Português, papel pautado. */
:root {
  --papel: #F6F8FB;
  --folha: #FFFFFF;
  --tinta: #172033;
  --grafite: #586378;
  --linha: #D9E0EA;
  --pauta: rgba(38, 72, 201, 0.065);
  --azul: #2648C9;
  --azul-suave: #E8EDFC;
  --verde: #0B7A63;
  --verde-suave: #E0F2ED;
  --marca: #FFE45E;
  --marca-tinta: #362D00;
  --certo: #1C7A4A;
  --certo-suave: #E2F3E9;
  --sombra: 0 1px 2px rgba(23, 32, 51, 0.06), 0 4px 16px rgba(23, 32, 51, 0.05);
  --f-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-codigo: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --acento: var(--azul);
  --acento-suave: var(--azul-suave);
  --raio: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #0F131B; --folha: #171D28; --tinta: #E5E9F1; --grafite: #9AA4B7; --linha: #2A3344;
    --pauta: rgba(130, 155, 255, 0.06); --azul: #8AA2FF; --azul-suave: #1D2645; --verde: #4CC5A6; --verde-suave: #11302A;
    --marca: #E6CC48; --marca-tinta: #1E1900; --certo: #5DCB92; --certo-suave: #13291E;
    --sombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #0F131B; --folha: #171D28; --tinta: #E5E9F1; --grafite: #9AA4B7; --linha: #2A3344;
  --pauta: rgba(130, 155, 255, 0.06); --azul: #8AA2FF; --azul-suave: #1D2645; --verde: #4CC5A6; --verde-suave: #11302A;
  --marca: #E6CC48; --marca-tinta: #1E1900; --certo: #5DCB92; --certo-suave: #13291E;
  --sombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
}
body[data-d="portugues"] { --acento: var(--verde); --acento-suave: var(--verde-suave); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--papel); color: var(--tinta);
  font: 16px/1.55 var(--f-texto);
  background-image: linear-gradient(var(--pauta) 1px, transparent 1px), linear-gradient(90deg, var(--pauta) 1px, transparent 1px);
  background-size: 22px 22px;
}
body[data-d="portugues"] { background-image: linear-gradient(var(--pauta) 1px, transparent 1px); background-size: 100% 28px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-titulo); text-wrap: balance; margin: 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--folha); }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--folha); border-bottom: 1px solid var(--linha); }
.topo-in {
  max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.marca { min-width: 0; flex: 1 1 auto; }
.sobre { display: block; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--grafite); font-weight: 700; }
.marca h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; line-height: 1.1; }
.marca h1 small { font-family: var(--f-texto); font-weight: 400; font-size: 15px; color: var(--grafite); margin-left: 8px; }
.abas { display: flex; gap: 4px; background: var(--papel); border: 1px solid var(--linha); padding: 4px; border-radius: 999px; }
.abas a { text-decoration: none; color: var(--grafite); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.abas a[aria-current="page"] { background: var(--acento); color: var(--folha); }

.layout {
  max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 24px; align-items: start;
  padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.filtros {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 18px;
  background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px;
  max-height: calc(100vh - 110px); overflow: auto;
}
.filtros fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.filtros legend, .filtros label.rotulo { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--grafite); margin-bottom: 8px; padding: 0; }
.campo { width: 100%; padding: 9px 11px; border: 1px solid var(--linha); border-radius: 8px; background: var(--papel); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--linha); background: var(--folha); border-radius: 999px; padding: 5px 11px; font-size: 14px; line-height: 1.3;
  display: inline-flex; gap: 6px; align-items: baseline;
}
.chip small { color: var(--grafite); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--folha); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.lista-check { display: flex; flex-direction: column; gap: 4px; }
.lista-check label { display: flex; gap: 9px; align-items: flex-start; padding: 4px 2px; font-size: 15px; cursor: pointer; }
.lista-check input { accent-color: var(--acento); width: 17px; height: 17px; margin-top: 3px; flex: none; }
.lista-check small { margin-left: auto; color: var(--grafite); font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; padding: 0; color: var(--acento); font-weight: 700; text-align: left; text-decoration: underline; text-underline-offset: 3px; }

.btn { border: 1px solid var(--acento); background: var(--acento); color: var(--folha); border-radius: 8px; padding: 9px 16px; font-weight: 700; }
.btn-sec { border: 1px solid var(--linha); background: var(--folha); color: var(--tinta); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.btn-sec:hover { border-color: var(--acento); }
.so-mobile { display: none; }

.res-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.res-topo p { margin: 0; color: var(--grafite); }
.res-topo b { color: var(--tinta); font-variant-numeric: tabular-nums; }
#lista { display: flex; flex-direction: column; gap: 14px; }

.q { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px 20px; box-shadow: var(--sombra); min-width: 0; }
.q.sel { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento), var(--sombra); }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--grafite); margin-bottom: 10px; }
.cod { font-family: var(--f-codigo); font-size: 12px; color: var(--tinta); background: var(--papel); border: 1px solid var(--linha); padding: 1px 7px; border-radius: 5px; }
.q.sel .cod { background: var(--marca); color: var(--marca-tinta); border-color: transparent; }
.ano { font-weight: 700; color: var(--acento); }
.dif { display: inline-flex; align-items: center; gap: 5px; }
.dif i { display: inline-flex; gap: 2px; }
.dif i b { width: 6px; height: 10px; border-radius: 2px; background: var(--linha); }
.dif i b.on { background: var(--grafite); }
.tipo-tag { border: 1px dashed var(--linha); padding: 0 7px; border-radius: 5px; }
.enun { margin: 0 0 12px; white-space: pre-line; font-size: 17px; }
.alts { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alts li { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; }
.alts .l { font-family: var(--f-titulo); font-weight: 800; color: var(--grafite); flex: none; width: 1.3em; }
.q.aberta .alts li.ok { background: var(--certo-suave); border-color: var(--certo); }
.q.aberta .alts li.ok .l { color: var(--certo); }
.tab-wrap { overflow-x: auto; margin: 0 0 12px; }
table.dados { border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.dados th, table.dados td { border: 1px solid var(--linha); padding: 6px 14px; text-align: left; }
table.dados th { background: var(--papel); font-weight: 700; }
details.texto { border: 1px solid var(--linha); border-radius: 8px; margin: 0 0 12px; background: var(--papel); }
details.texto summary { cursor: pointer; padding: 9px 12px; font-size: 14px; color: var(--grafite); }
details.texto summary b { color: var(--tinta); }
.texto-corpo { padding: 4px 16px 14px; font-size: 16px; max-width: 68ch; }
.texto-corpo p { margin: 0 0 8px; }
.texto-corpo.verso p { margin: 0; }
.texto-corpo.verso p.vazio { height: 12px; }
.q-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.q-acoes .btn-sec[aria-pressed="true"] { background: var(--marca); color: var(--marca-tinta); border-color: var(--marca); }
.resp { margin-top: 14px; border-top: 1px dashed var(--linha); padding-top: 12px; }
.resp h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--certo); }
.resp p { margin: 0 0 6px; max-width: 75ch; }
.resp .gab { font-family: var(--f-titulo); font-weight: 800; font-size: 18px; color: var(--certo); }
.vazio { background: var(--folha); border: 1px dashed var(--linha); border-radius: var(--raio); padding: 28px; text-align: center; color: var(--grafite); }
#mais { margin: 18px auto 0; display: block; }
#mais[hidden] { display: none !important; }
.aviso { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); padding: 24px; }

.barra-sel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--tinta); color: var(--papel);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.barra-in { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.barra-in p { margin: 0; }
.barra-in b { font-family: var(--f-titulo); font-size: 20px; background: var(--marca); color: var(--marca-tinta); padding: 0 8px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.barra-in .btn { background: var(--papel); color: var(--tinta); border-color: var(--papel); }
.barra-in .link { color: var(--papel); }

.painel-fundo { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 22, .45); display: flex; justify-content: flex-end; }
.painel {
  width: min(520px, 100%); height: 100%; background: var(--folha); display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.18);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.painel-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--linha); }
.painel-cab h2 { font-size: 22px; }
.painel-corpo { flex: 1; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 20px; }
.painel-pe { padding: 14px 20px; border-top: 1px solid var(--linha); display: flex; flex-wrap: wrap; gap: 8px; }
.painel-pe .btn, .painel-pe .btn-sec { flex: 1 1 140px; }
.sel-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: n; }
.sel-lista li { display: flex; gap: 10px; align-items: center; border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; counter-increment: n; min-width: 0; }
.sel-lista li::before { content: counter(n); font-family: var(--f-titulo); font-weight: 800; color: var(--acento); width: 1.6em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.sel-info { flex: 1; min-width: 0; font-size: 14px; }
.sel-info span { display: block; color: var(--grafite); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { border: 1px solid var(--linha); background: var(--folha); border-radius: 6px; width: 30px; height: 30px; display: inline-grid; place-items: center; flex: none; padding: 0; font-size: 15px; line-height: 1; }
.mini:disabled { opacity: .35; cursor: default; }
.form-grid { display: grid; gap: 12px; }
.form-grid label.rotulo { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--grafite); margin-bottom: 6px; }
.op { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.op input { accent-color: var(--acento); width: 17px; height: 17px; margin-top: 3px; flex: none; }
.op small { display: block; color: var(--grafite); font-size: 13px; }
.nota { font-size: 13px; color: var(--grafite); margin: 0; }

.projecao {
  position: fixed; inset: 0; z-index: 30; background: var(--folha); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.proj-topo, .proj-pe {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.proj-topo { border-bottom: 1px solid var(--linha); color: var(--grafite); }
.proj-topo b { color: var(--tinta); font-family: var(--f-titulo); font-size: 20px; font-variant-numeric: tabular-nums; }
.proj-pe { border-top: 1px solid var(--linha); }
.proj-corpo {
  flex: 1; overflow: auto; display: grid; gap: 32px; align-content: start; grid-template-columns: minmax(0, 1fr);
  padding-block: 28px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  font-size: clamp(19px, 2.3vw, 32px); line-height: 1.45; max-width: 1500px; width: 100%; margin: 0 auto;
}
.proj-corpo.com-texto { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
.proj-texto { font-size: .78em; border-right: 2px solid var(--linha); padding-right: 28px; }
.proj-texto h3 { font-size: 1.15em; margin-bottom: 10px; }
.proj-texto p { margin: 0 0 .5em; }
.proj-texto.verso p { margin: 0; }
.proj-texto.verso p.vazio { height: .6em; }
.proj-corpo .enun { font-size: 1em; }
.proj-corpo .alts li { padding: .3em .5em; }
.proj-corpo .alts li.ok.on { background: var(--certo-suave); border-color: var(--certo); }
.proj-corpo .alts li.ok.on .l { color: var(--certo); }
.proj-corpo .resp { font-size: .72em; }
.proj-corpo table.dados { font-size: .85em; }

#impressao { display: none; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .filtros { position: static; max-height: none; }
  .filtros.fechado { display: none; }
  .so-mobile { display: inline-block; }
  .proj-corpo.com-texto { grid-template-columns: minmax(0, 1fr); }
  .proj-texto { border-right: 0; padding-right: 0; border-bottom: 2px solid var(--linha); padding-bottom: 18px; }
  .q { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .q, .chip, .btn-sec { transition: border-color .15s, background-color .15s, box-shadow .15s; }
}

@media print {
  @page { size: A4; margin: 14mm 15mm; }
  body { background: #fff !important; color: #000; }
  body > *:not(#impressao) { display: none !important; }
  body::before { display: none; }
  #impressao { display: block; }
}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <span class="sobre">Banco de Questões</span>
      <h1 id="titulo">Carregando questões…</h1>
    </div>
    <nav id="abas" class="abas" aria-label="Componente curricular" hidden></nav>
    <button id="btn-filtros" class="btn-sec so-mobile" type="button" aria-controls="filtros" aria-expanded="false">Filtros</button>
  </div>
</header>

<main class="layout">
  <aside id="filtros" class="filtros fechado" aria-label="Filtros">
    <div>
      <label class="rotulo" for="f-busca">Buscar</label>
      <input id="f-busca" class="campo" type="search" placeholder="Palavra, assunto ou código" autocomplete="off">
    </div>
    <fieldset><legend>Ano</legend><div id="f-anos" class="chips"></div></fieldset>
    <fieldset><legend id="lg-eixo">Eixo</legend><div id="f-eixos" class="lista-check"></div></fieldset>
    <div>
      <label class="rotulo" for="f-assunto">Assunto</label>
      <select id="f-assunto" class="campo"></select>
    </div>
    <fieldset><legend>Dificuldade</legend><div id="f-dif" class="chips"></div></fieldset>
    <fieldset><legend>Tipo de questão</legend><div id="f-tipo" class="chips"></div></fieldset>
    <button id="limpar" class="link" type="button">Limpar filtros</button>
  </aside>

  <section aria-live="polite">
    <div class="res-topo">
      <p id="contagem"></p>
      <button id="sel-todas" class="btn-sec" type="button">Selecionar todas desta busca</button>
    </div>
    <div id="lista"></div>
    <button id="mais" class="btn-sec" type="button" hidden>Mostrar mais questões</button>
  </section>
</main>

<div id="barra-sel" class="barra-sel" hidden>
  <div class="barra-in">
    <p><b id="n-sel">0</b> questões selecionadas</p>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <button id="limpar-sel" class="link" type="button">Limpar seleção</button>
      <button id="abrir-painel" class="btn" type="button">Montar material</button>
    </div>
  </div>
</div>

<div id="painel-fundo" class="painel-fundo" hidden>
  <div class="painel" role="dialog" aria-modal="true" aria-labelledby="painel-tit">
    <div class="painel-cab">
      <h2 id="painel-tit">Montar material</h2>
      <button id="fechar-painel" class="btn-sec" type="button">Fechar</button>
    </div>
    <div class="painel-corpo">
      <ol id="sel-lista" class="sel-lista"></ol>
      <div class="form-grid">
        <div>
          <label class="rotulo" for="o-modelo">Tipo de material</label>
          <select id="o-modelo" class="campo">
            <option>Lista de exercícios</option>
            <option>Avaliação</option>
            <option>Atividade de fixação</option>
            <option>Atividade em sala</option>
          </select>
        </div>
        <div>
          <label class="rotulo" for="o-titulo">Título</label>
          <input id="o-titulo" class="campo" type="text">
        </div>
        <div>
          <label class="rotulo" for="o-escola">Escola (opcional)</label>
          <input id="o-escola" class="campo" type="text" placeholder="Nome da escola">
        </div>
        <label class="op"><input id="o-cab" type="checkbox" checked><span>Campos de identificação<small>Aluno(a), turma e data no topo da folha.</small></span></label>
        <label class="op"><input id="o-gab" type="checkbox" checked><span>Gabarito no final<small>Em página separada, para o professor.</small></span></label>
        <label class="op"><input id="o-com" type="checkbox"><span>Respostas comentadas no gabarito<small>Versão do professor, com a explicação de cada questão.</small></span></label>
        <label class="op"><input id="o-emb" type="checkbox"><span>Embaralhar alternativas<small>Gera uma versão diferente a cada impressão; o gabarito acompanha.</small></span></label>
      </div>
      <p class="nota">Na impressão, escolha “Salvar como PDF” para gerar o arquivo.</p>
    </div>
    <div class="painel-pe">
      <button id="b-imprimir" class="btn" type="button">Imprimir ou salvar PDF</button>
      <button id="b-word" class="btn-sec" type="button">Baixar para Word</button>
      <button id="b-projetar" class="btn-sec" type="button">Projetar em sala</button>
    </div>
  </div>
</div>

<div id="projecao" class="projecao" hidden role="dialog" aria-modal="true" aria-label="Modo de projeção">
  <div class="proj-topo">
    <span>Questão <b id="p-pos">1</b> de <span id="p-tot">1</span> · <span id="p-meta"></span></span>
    <button id="p-sair" class="btn-sec" type="button">Sair da projeção</button>
  </div>
  <div id="p-corpo" class="proj-corpo"></div>
  <div class="proj-pe">
    <button id="p-ant" class="btn-sec" type="button">← Anterior</button>
    <button id="p-resp" class="btn" type="button">Mostrar resposta</button>
    <button id="p-prox" class="btn-sec" type="button">Próxima →</button>
  </div>
</div>

<div id="impressao"></div>

<script>
(() => {
  "use strict";
  const LETRAS = "ABCDE";
  const DIFS = ["fácil", "média", "difícil"];
  const TIPOS = ["objetiva", "discursiva"];
  const POR_PAGINA = 25;
  const $ = (s) => document.querySelector(s);

  const st = {
    lista: [], slug: "", dados: null, textos: {}, porId: new Map(),
    f: { anos: new Set(), eixos: new Set(), assunto: "", difs: new Set(), tipos: new Set(), busca: "" },
    sel: [], abertas: new Set(), limite: POR_PAGINA,
    proj: { itens: [], i: 0, on: false }
  };

  // ---------- utilidades ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } };
  const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } };
  async function json(url) {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(url + " respondeu " + r.status);
    return r.json();
  }
  function paragrafos(txt, verso) {
    return String(txt).split("\n").map((l) => (l.trim() === "" ? (verso ? '<p class="vazio"></p>' : "") : "<p>" + esc(l) + "</p>")).join("");
  }
  const ehVerso = (t) => /poema|poesia|cordel|canção|letra/i.test(t.genero || "");
  function comentario(q, mapa) {
    return esc(q.comentario).replace(/\{([A-E])\}/g, (_, l) => "<b>" + (mapa ? mapa(l) : l) + "</b>");
  }
  function tabelaHTML(t) {
    if (!t) return "";
    return '<div class="tab-wrap"><table class="dados"><thead><tr>' + t.cabecalho.map((c) => "<th>" + esc(c) + "</th>").join("") +
      "</tr></thead><tbody>" + t.linhas.map((l) => "<tr>" + l.map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
  }
  function difHTML(d) {
    const n = DIFS.indexOf(d) + 1;
    return '<span class="dif" title="Dificuldade: ' + esc(d) + '"><i>' + [1, 2, 3].map((k) => '<b class="' + (k <= n ? "on" : "") + '"></b>').join("") + "</i>" + esc(d) + "</span>";
  }

  // ---------- carregamento ----------
  async function iniciar() {
    const params = new URLSearchParams(location.search);
    const fixa = params.get("d");
    try {
      st.lista = (await json("dados/disciplinas.json")).disciplinas;
    } catch (e) {
      return erro("Não foi possível carregar a lista de disciplinas (dados/disciplinas.json).");
    }
    const hash = location.hash.slice(1);
    const slug = st.lista.some((d) => d.slug === fixa) ? fixa : st.lista.some((d) => d.slug === hash) ? hash : st.lista[0].slug;
    if (!fixa && st.lista.length > 1) {
      const nav = $("#abas");
      nav.innerHTML = st.lista.map((d) => '<a href="#' + d.slug + '" data-slug="' + d.slug + '">' + esc(d.nome) + "</a>").join("");
      nav.hidden = false;
      window.addEventListener("hashchange", () => {
        const s = location.hash.slice(1);
        if (s && s !== st.slug && st.lista.some((d) => d.slug === s)) carregar(s);
      });
    }
    carregar(slug);
  }

  async function carregar(slug) {
    const d = st.lista.find((x) => x.slug === slug);
    st.slug = slug;
    document.body.dataset.d = slug;
    document.querySelectorAll("#abas a").forEach((a) => (a.dataset.slug === slug ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    $("#titulo").textContent = d.nome;
    try {
      st.dados = await json("dados/" + d.arquivo);
    } catch (e) {
      return erro("Não foi possível carregar as questões de " + d.nome + " (dados/" + d.arquivo + "). Confira se o arquivo existe e se o JSON é válido.");
    }
    st.textos = st.dados.textos || {};
    st.dados.questoes.sort((a, b) => a.ano - b.ano || a.id.localeCompare(b.id));
    st.porId = new Map(st.dados.questoes.map((q) => [q.id, q]));
    const salvo = ler("bq:" + slug, {});
    st.sel = (salvo.sel || []).filter((id) => st.porId.has(id));
    st.f = { anos: new Set(salvo.anos || []), eixos: new Set(salvo.eixos || []), assunto: salvo.assunto || "", difs: new Set(salvo.difs || []), tipos: new Set(salvo.tipos || []), busca: salvo.busca || "" };
    st.abertas = new Set();
    st.limite = POR_PAGINA;
    $("#titulo").innerHTML = esc(d.nome) + "<small>" + st.dados.questoes.length + " questões</small>";
    $("#lg-eixo").textContent = st.dados.rotulo_eixo || "Eixo";
    $("#f-busca").value = st.f.busca;
    $("#o-titulo").value = "";
    montarFiltros();
    render();
  }

  function erro(msg) {
    $("#titulo").textContent = "Banco de Questões";
    $("#lista").innerHTML = '<div class="aviso"><h3>Algo deu errado</h3><p>' + esc(msg) + "</p></div>";
    $("#contagem").textContent = "";
  }

  function salvar() {
    gravar("bq:" + st.slug, { sel: st.sel, anos: [...st.f.anos], eixos: [...st.f.eixos], assunto: st.f.assunto, difs: [...st.f.difs], tipos: [...st.f.tipos], busca: st.f.busca });
  }

  // ---------- filtros ----------
  const qs = () => st.dados.questoes;
  function contar(campo) {
    const c = new Map();
    qs().forEach((q) => c.set(q[campo], (c.get(q[campo]) || 0) + 1));
    return c;
  }
  function chips(el, valores, ativo, rotulo, cont) {
    el.innerHTML = valores.map((v) => '<button type="button" class="chip" data-v="' + esc(v) + '" aria-pressed="' + ativo.has(v) + '">' + esc(rotulo(v)) + "<small>" + (cont.get(v) || 0) + "</small></button>").join("");
  }
  function montarFiltros() {
    const anos = [...new Set(qs().map((q) => q.ano))].sort((a, b) => a - b);
    chips($("#f-anos"), anos.map(String), new Set([...st.f.anos].map(String)), (v) => v + "º", new Map([...contar("ano")].map(([k, v]) => [String(k), v])));
    const eixos = st.dados.eixos || [...new Set(qs().map((q) => q.eixo))];
    const ce = contar("eixo");
    $("#f-eixos").innerHTML = eixos.filter((e) => ce.get(e)).map((e, i) => '<label><input type="checkbox" id="eixo-' + i + '" value="' + esc(e) + '"' + (st.f.eixos.has(e) ? " checked" : "") + "><span>" + esc(e) + "</span><small>" + ce.get(e) + "</small></label>").join("");
    chips($("#f-dif"), DIFS, st.f.difs, (v) => v, contar("dificuldade"));
    chips($("#f-tipo"), TIPOS, st.f.tipos, (v) => v === "objetiva" ? "Objetiva" : "Discursiva", contar("tipo"));
    montarAssuntos();
  }
  function montarAssuntos() {
    const base = qs().filter((q) => (!st.f.eixos.size || st.f.eixos.has(q.eixo)) && (!st.f.anos.size || st.f.anos.has(q.ano)));
    const c = new Map();
    base.forEach((q) => c.set(q.assunto, (c.get(q.assunto) || 0) + 1));
    const nomes = [...c.keys()].sort((a, b) => a.localeCompare(b, "pt-BR"));
    if (st.f.assunto && !c.has(st.f.assunto)) st.f.assunto = "";
    $("#f-assunto").innerHTML = '<option value="">Todos os assuntos</option>' + nomes.map((n) => '<option value="' + esc(n) + '"' + (n === st.f.assunto ? " selected" : "") + ">" + esc(n) + " (" + c.get(n) + ")</option>").join("");
  }
  function filtradas() {
    const termos = norm(st.f.busca).split(/\s+/).filter(Boolean);
    return qs().filter((q) => {
      if (st.f.anos.size && !st.f.anos.has(q.ano)) return false;
      if (st.f.eixos.size && !st.f.eixos.has(q.eixo)) return false;
      if (st.f.assunto && q.assunto !== st.f.assunto) return false;
      if (st.f.difs.size && !st.f.difs.has(q.dificuldade)) return false;
      if (st.f.tipos.size && !st.f.tipos.has(q.tipo)) return false;
      if (termos.length) {
        const t = st.textos[q.texto];
        const alvo = norm([q.id, q.assunto, q.eixo, q.enunciado, (q.alternativas || []).join(" "), q.bncc || "", t ? t.titulo + " " + t.genero : ""].join(" "));
        if (!termos.every((x) => alvo.includes(x))) return false;
      }
      return true;
    });
  }

  // ---------- lista ----------
  function cartao(q) {
    const sel = st.sel.includes(q.id), aberta = st.abertas.has(q.id), t = st.textos[q.texto];
    const texto = t ? '<details class="texto"><summary>Texto-base: <b>' + esc(t.titulo) + "</b> · " + esc(t.genero) + '</summary><div class="texto-corpo' + (ehVerso(t) ? " verso" : "") + '">' + paragrafos(t.conteudo, ehVerso(t)) + "</div></details>" : "";
    const alts = q.tipo === "objetiva" ? '<ol class="alts">' + q.alternativas.map((a, i) => '<li class="' + (LETRAS[i] === q.gabarito ? "ok" : "") + '"><span class="l">' + LETRAS[i] + "</span><span>" + esc(a) + "</span></li>").join("") + "</ol>" : "";
    const resp = q.tipo === "objetiva"
      ? '<h4>Resposta comentada</h4><p>Gabarito: <span class="gab">' + q.gabarito + "</span></p><p>" + comentario(q) + "</p>"
      : '<h4>Resposta esperada</h4><p>' + esc(q.resposta_esperada) + "</p><h4>Orientações de correção</h4><p>" + comentario(q) + "</p>";
    return '<article class="q' + (sel ? " sel" : "") + (aberta ? " aberta" : "") + '" data-id="' + esc(q.id) + '">' +
      '<div class="q-meta"><span class="cod">' + esc(q.id) + '</span><span class="ano">' + q.ano + 'º ano</span><span>' + esc(q.eixo) + " › " + esc(q.assunto) + "</span>" + difHTML(q.dificuldade) + '<span class="tipo-tag">' + (q.tipo === "objetiva" ? "Objetiva" : "Discursiva") + "</span>" + (q.bncc ? '<span class="cod">' + esc(q.bncc) + "</span>" : "") + "</div>" +
      texto + '<p class="enun">' + esc(q.enunciado) + "</p>" + tabelaHTML(q.tabela) + alts +
      '<div class="q-acoes"><button type="button" class="btn-sec" data-acao="sel" aria-pressed="' + sel + '">' + (sel ? "Selecionada ✓" : "Selecionar") + "</button>" +
      '<button type="button" class="btn-sec" data-acao="resp" aria-expanded="' + aberta + '">' + (aberta ? "Ocultar resposta" : "Ver resposta comentada") + "</button>" +
      '<button type="button" class="btn-sec" data-acao="proj">Projetar</button></div>' +
      '<div class="resp"' + (aberta ? "" : " hidden") + ">" + resp + "</div></article>";
  }
  function render() {
    const lista = filtradas();
    const n = lista.length, tot = qs().length;
    $("#contagem").innerHTML = n === tot ? "<b>" + tot + "</b> questões no acervo" : "<b>" + n + "</b> de " + tot + " questões com esses filtros";
    $("#sel-todas").hidden = n === 0;
    if (!n) {
      $("#lista").innerHTML = '<div class="vazio"><p>Nenhuma questão encontrada com esses filtros.</p><button type="button" class="link" data-acao="limpar">Limpar filtros</button></div>';
    } else {
      $("#lista").innerHTML = lista.slice(0, st.limite).map(cartao).join("");
    }
    $("#mais").hidden = n <= st.limite;
    $("#mais").textContent = "Mostrar mais questões (" + (n - st.limite) + " restantes)";
    const ativos = st.f.anos.size + st.f.eixos.size + (st.f.assunto ? 1 : 0) + st.f.difs.size + st.f.tipos.size + (st.f.busca ? 1 : 0);
    $("#btn-filtros").textContent = ativos ? "Filtros (" + ativos + ")" : "Filtros";
    barra();
    salvar();
  }
  function barra() {
    $("#barra-sel").hidden = st.sel.length === 0;
    $("#n-sel").textContent = st.sel.length;
  }
  function atualizarCartao(id) {
    const el = document.querySelector('.q[data-id="' + CSS.escape(id) + '"]');
    if (el) el.outerHTML = cartao(st.porId.get(id));
  }

  // ---------- eventos dos filtros ----------
  function alternar(set, v) { set.has(v) ? set.delete(v) : set.add(v); }
  function refiltrar() { st.limite = POR_PAGINA; render(); }
  $("#f-anos").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; alternar(st.f.anos, Number(b.dataset.v)); b.setAttribute("aria-pressed", st.f.anos.has(Number(b.dataset.v))); montarAssuntos(); refiltrar(); });
  $("#f-dif").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; alternar(st.f.difs, b.dataset.v); b.setAttribute("aria-pressed", st.f.difs.has(b.dataset.v)); refiltrar(); });
  $("#f-tipo").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; alternar(st.f.tipos, b.dataset.v); b.setAttribute("aria-pressed", st.f.tipos.has(b.dataset.v)); refiltrar(); });
  $("#f-eixos").addEventListener("change", (e) => { alternar(st.f.eixos, e.target.value); montarAssuntos(); refiltrar(); });
  $("#f-assunto").addEventListener("change", (e) => { st.f.assunto = e.target.value; refiltrar(); });
  let tBusca;
  $("#f-busca").addEventListener("input", (e) => { clearTimeout(tBusca); tBusca = setTimeout(() => { st.f.busca = e.target.value.trim(); refiltrar(); }, 180); });
  function limparFiltros() {
    st.f = { anos: new Set(), eixos: new Set(), assunto: "", difs: new Set(), tipos: new Set(), busca: "" };
    $("#f-busca").value = "";
    montarFiltros(); refiltrar();
  }
  $("#limpar").addEventListener("click", limparFiltros);
  $("#btn-filtros").addEventListener("click", () => {
    const f = $("#filtros"); f.classList.toggle("fechado");
    $("#btn-filtros").setAttribute("aria-expanded", !f.classList.contains("fechado"));
  });
  $("#mais").addEventListener("click", () => { st.limite += POR_PAGINA; render(); });
  $("#sel-todas").addEventListener("click", () => {
    filtradas().forEach((q) => { if (!st.sel.includes(q.id)) st.sel.push(q.id); });
    render();
  });

  // ---------- ações nos cartões ----------
  $("#lista").addEventListener("click", (e) => {
    const b = e.target.closest("[data-acao]"); if (!b) return;
    if (b.dataset.acao === "limpar") return limparFiltros();
    const id = b.closest(".q").dataset.id;
    if (b.dataset.acao === "sel") {
      const i = st.sel.indexOf(id);
      i >= 0 ? st.sel.splice(i, 1) : st.sel.push(id);
      atualizarCartao(id); barra(); salvar();
    } else if (b.dataset.acao === "resp") {
      alternar(st.abertas, id); atualizarCartao(id);
      const novo = document.querySelector('.q[data-id="' + CSS.escape(id) + '"] [data-acao="resp"]'); if (novo) novo.focus();
    } else if (b.dataset.acao === "proj") {
      projetar([st.porId.get(id)]);
    }
  });

  // ---------- painel de montagem ----------
  const prefs = ler("bq:prefs", {});
  $("#o-escola").value = prefs.escola || "";
  ["o-cab", "o-gab", "o-com", "o-emb"].forEach((k) => { if (k in prefs) $("#" + k).checked = prefs[k]; });
  $("#o-modelo").value = prefs.modelo || "Lista de exercícios";
  function lerOpcoes() {
    const o = { escola: $("#o-escola").value.trim(), modelo: $("#o-modelo").value, "o-cab": $("#o-cab").checked, "o-gab": $("#o-gab").checked, "o-com": $("#o-com").checked, "o-emb": $("#o-emb").checked };
    gravar("bq:prefs", o);
    return o;
  }
  ["o-escola", "o-modelo", "o-cab", "o-gab", "o-com", "o-emb"].forEach((k) => $("#" + k).addEventListener("change", lerOpcoes));
  function tituloPadrao() { return $("#o-modelo").value + " de " + st.dados.disciplina; }
  $("#o-modelo").addEventListener("change", () => { $("#o-titulo").placeholder = tituloPadrao(); });

  function renderSel() {
    const n = st.sel.length;
    $("#sel-lista").innerHTML = n ? st.sel.map((id, i) => {
      const q = st.porId.get(id);
      return '<li data-id="' + esc(id) + '"><div class="sel-info"><b>' + esc(id) + "</b> · " + q.ano + "º ano · " + esc(q.assunto) + "<span>" + esc(q.enunciado) + "</span></div>" +
        '<button type="button" class="mini" data-m="-1" aria-label="Subir"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
        '<button type="button" class="mini" data-m="1" aria-label="Descer"' + (i === n - 1 ? " disabled" : "") + ">↓</button>" +
        '<button type="button" class="mini" data-m="x" aria-label="Remover">×</button></li>';
    }).join("") : '<li style="justify-content:center;color:var(--grafite)">Nenhuma questão selecionada.</li>';
    ["#b-imprimir", "#b-word", "#b-projetar"].forEach((s) => ($(s).disabled = !n));
  }
  $("#sel-lista").addEventListener("click", (e) => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    const id = b.closest("li").dataset.id, i = st.sel.indexOf(id);
    if (b.dataset.m === "x") { st.sel.splice(i, 1); atualizarCartao(id); }
    else { const j = i + Number(b.dataset.m); [st.sel[i], st.sel[j]] = [st.sel[j], st.sel[i]]; }
    renderSel(); barra(); salvar();
    if (!st.sel.length) fecharPainel();
  });
  function abrirPainel() { $("#o-titulo").placeholder = tituloPadrao(); renderSel(); $("#painel-fundo").hidden = false; $("#fechar-painel").focus(); }
  function fecharPainel() { $("#painel-fundo").hidden = true; }
  $("#abrir-painel").addEventListener("click", abrirPainel);
  $("#fechar-painel").addEventListener("click", fecharPainel);
  $("#painel-fundo").addEventListener("click", (e) => { if (e.target.id === "painel-fundo") fecharPainel(); });
  $("#limpar-sel").addEventListener("click", () => { st.sel = []; render(); });

  // ---------- documento (impressão e Word) ----------
  function embaralhar(n) {
    const a = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const CSS_DOC = `
    .doc{font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:11.5pt;line-height:1.45;color:#000}
    .doc h1{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:17pt;margin:0 0 2pt}
    .doc .esc{font-size:10pt;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4pt}
    .doc .sub{font-size:10pt;color:#333;margin:0 0 10pt}
    .doc .ident{width:100%;border-collapse:collapse;margin:0 0 14pt;font-size:10.5pt}
    .doc .ident td{border:1px solid #000;padding:6pt 8pt}
    .doc .qd{margin:0 0 14pt;page-break-inside:avoid;break-inside:avoid}
    .doc .num{font-weight:bold}
    .doc .tx{border:1px solid #888;padding:8pt 10pt;margin:0 0 10pt;page-break-inside:avoid;break-inside:avoid}
    .doc .tx h3{font-size:12pt;margin:0 0 4pt}
    .doc .tx .gen{font-size:9pt;color:#444;margin:0 0 6pt}
    .doc .tx p{margin:0 0 4pt}
    .doc .tx.verso p{margin:0}
    .doc .tx.verso p.vazio{height:8pt}
    .doc .ins{font-size:10pt;font-style:italic;margin:0 0 4pt}
    .doc p{margin:0 0 4pt}
    .doc .alt{margin:0 0 2pt 14pt}
    .doc table.dados{border-collapse:collapse;margin:4pt 0 6pt}
    .doc table.dados th,.doc table.dados td{border:1px solid #000;padding:3pt 10pt;text-align:left}
    .doc .linha{border-bottom:1px solid #777;height:22pt}
    .doc .gab{page-break-before:always;break-before:page}
    .doc .gab h2{font-size:15pt;margin:0 0 8pt}
    .doc .gab table{border-collapse:collapse}
    .doc .gab td,.doc .gab th{border:1px solid #000;padding:3pt 10pt;text-align:center}
    .doc .com{margin:8pt 0 0;page-break-inside:avoid;break-inside:avoid}`;

  function documento() {
    const o = lerOpcoes();
    const titulo = $("#o-titulo").value.trim() || tituloPadrao();
    const itens = st.sel.map((id) => st.porId.get(id));
    const anos = [...new Set(itens.map((q) => q.ano))].sort((a, b) => a - b);
    let h = '<div class="doc">';
    if (o.escola) h += '<p class="esc">' + esc(o.escola) + "</p>";
    h += "<h1>" + esc(titulo) + '</h1><p class="sub">' + esc(st.dados.disciplina) + " · " + anos.map((a) => a + "º").join(", ") + " ano · " + itens.length + " questões</p>";
    if (o["o-cab"]) h += '<table class="ident"><tr><td colspan="2">Aluno(a):</td></tr><tr><td>Turma:</td><td>Data: ____/____/________</td></tr></table>';
    let ultimoTexto = null;
    const gab = [];
    itens.forEach((q, k) => {
      const n = k + 1;
      if (q.texto && q.texto !== ultimoTexto && st.textos[q.texto]) {
        const t = st.textos[q.texto];
        let usa = 0;
        while (k + usa < itens.length && itens[k + usa].texto === q.texto) usa++;
        h += '<div class="tx' + (ehVerso(t) ? " verso" : "") + '"><p class="ins">Leia o texto para responder ' + (usa > 1 ? "às questões " + n + " a " + (n + usa - 1) : "à questão " + n) + '.</p><h3>' + esc(t.titulo) + '</h3><p class="gen">' + esc(t.genero) + " · Texto elaborado para este banco de questões.</p>" + paragrafos(t.conteudo, ehVerso(t)) + "</div>";
      }
      ultimoTexto = q.texto || null;
      h += '<div class="qd"><p><span class="num">' + n + ".</span> " + esc(q.enunciado).replace(/\n/g, "<br>") + "</p>" + tabelaHTML(q.tabela).replace(/<\/?div[^>]*>/g, "");
      if (q.tipo === "objetiva") {
        const perm = o["o-emb"] ? embaralhar(q.alternativas.length) : [...q.alternativas.keys()];
        perm.forEach((orig, pos) => { h += '<p class="alt">(' + LETRAS[pos] + ") " + esc(q.alternativas[orig]) + "</p>"; });
        const novaLetra = (l) => LETRAS[perm.indexOf(LETRAS.indexOf(l))];
        gab.push({ n, q, letra: novaLetra(q.gabarito), com: comentario(q, novaLetra) });
      } else {
        h += '<div class="linha"></div>'.repeat(q.ano <= 5 ? 5 : 6);
        gab.push({ n, q, letra: "—", com: comentario(q) });
      }
      h += "</div>";
    });
    if (o["o-gab"]) {
      h += '<div class="gab"><h2>Gabarito · ' + esc(titulo) + '</h2><table><tr><th>Questão</th>' + gab.map((g) => "<th>" + g.n + "</th>").join("") + "</tr><tr><th>Resposta</th>" + gab.map((g) => "<td>" + g.letra + "</td>").join("") + "</tr></table>";
      if (o["o-com"]) {
        gab.forEach((g) => {
          h += '<div class="com"><p><b>Questão ' + g.n + "</b> (" + esc(g.q.id) + " · " + esc(g.q.assunto) + ")" + (g.q.tipo === "objetiva" ? " · Gabarito: <b>" + g.letra + "</b>" : "") + "</p>" +
            (g.q.tipo === "discursiva" ? "<p><b>Resposta esperada:</b> " + esc(g.q.resposta_esperada) + "</p>" : "") + "<p>" + g.com + "</p></div>";
        });
      } else {
        h += '<p style="margin-top:8pt;font-size:10pt">Questões discursivas: ' + (gab.filter((g) => g.q.tipo === "discursiva").map((g) => g.n + ". " + esc(g.q.resposta_esperada)).join(" ") || "nenhuma") + "</p>";
      }
      h += "</div>";
    }
    return { html: h + "</div>", titulo };
  }

  $("#b-imprimir").addEventListener("click", () => {
    const d = documento();
    $("#impressao").innerHTML = "<style>" + CSS_DOC + "</style>" + d.html;
    const antes = document.title;
    document.title = d.titulo;
    setTimeout(() => { window.print(); document.title = antes; }, 60);
  });
  $("#b-word").addEventListener("click", () => {
    const d = documento();
    const arquivo = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(d.titulo) +
      "</title><style>@page{size:21cm 29.7cm;margin:1.5cm}" + CSS_DOC + "</style></head><body>" + d.html + "</body></html>";
    const url = URL.createObjectURL(new Blob(["﻿", arquivo], { type: "application/msword" }));
    const a = document.createElement("a");
    a.href = url; a.download = norm(d.titulo).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".doc";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
  $("#b-projetar").addEventListener("click", () => { fecharPainel(); projetar(st.sel.map((id) => st.porId.get(id))); });

  // ---------- projeção ----------
  function projetar(itens) {
    st.proj = { itens, i: 0, on: false };
    $("#projecao").hidden = false;
    try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* opcional */ }
    renderProj();
    $("#p-resp").focus();
  }
  function renderProj() {
    const { itens, i, on } = st.proj, q = itens[i], t = st.textos[q.texto];
    $("#p-pos").textContent = i + 1; $("#p-tot").textContent = itens.length;
    $("#p-meta").textContent = q.ano + "º ano · " + q.assunto;
    const corpo = $("#p-corpo");
    corpo.classList.toggle("com-texto", !!t);
    let h = t ? '<div class="proj-texto' + (ehVerso(t) ? " verso" : "") + '"><h3>' + esc(t.titulo) + "</h3>" + paragrafos(t.conteudo, ehVerso(t)) + "</div>" : "";
    h += '<div><p class="enun">' + esc(q.enunciado) + "</p>" + tabelaHTML(q.tabela);
    if (q.tipo === "objetiva") h += '<ol class="alts">' + q.alternativas.map((a, k) => '<li class="' + (LETRAS[k] === q.gabarito ? "ok" : "") + (on ? " on" : "") + '"><span class="l">' + LETRAS[k] + "</span><span>" + esc(a) + "</span></li>").join("") + "</ol>";
    if (on) h += '<div class="resp">' + (q.tipo === "objetiva" ? "<h4>Gabarito " + q.gabarito + "</h4>" : "<h4>Resposta esperada</h4><p>" + esc(q.resposta_esperada) + "</p>") + "<p>" + comentario(q) + "</p></div>";
    corpo.innerHTML = h + "</div>";
    corpo.scrollTop = 0;
    $("#p-resp").textContent = on ? "Ocultar resposta" : "Mostrar resposta";
    $("#p-ant").disabled = i === 0; $("#p-prox").disabled = i === itens.length - 1;
  }
  function sairProj() {
    $("#projecao").hidden = true;
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) { /* opcional */ }
  }
  $("#p-ant").addEventListener("click", () => { if (st.proj.i > 0) { st.proj.i--; st.proj.on = false; renderProj(); } });
  $("#p-prox").addEventListener("click", () => { if (st.proj.i < st.proj.itens.length - 1) { st.proj.i++; st.proj.on = false; renderProj(); } });
  $("#p-resp").addEventListener("click", () => { st.proj.on = !st.proj.on; renderProj(); });
  $("#p-sair").addEventListener("click", sairProj);
  document.addEventListener("keydown", (e) => {
    if (!$("#projecao").hidden) {
      if (e.key === "ArrowRight") $("#p-prox").click();
      else if (e.key === "ArrowLeft") $("#p-ant").click();
      else if (e.key === "Escape") sairProj();
      else return;
      e.preventDefault();
    } else if (!$("#painel-fundo").hidden && e.key === "Escape") fecharPainel();
  });

  iniciar();
})();
</script>
</body>
</html>
